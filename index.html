<script>
const $=s=>document.querySelector(s);

const kprov=r=>{if(estOf(r)===ESTADOS[3]){const ps=[...new Set(pagos(r).map(x=>(by(S.prov,x.prov)||{}).nombre).filter(Boolean))],v0=by(S.prov,(apr(r)||{}).prov||r.prov),c=ps.length?ps:v0?[v0.nombre]:[];
    return c.length?`<div class="kprov">${esc('Contratado: '+c.join(', '))}</div>`:''}
  const ns=[...new Set(pres(r).map(x=>(by(S.prov,x.prov)||{}).nombre).filter(Boolean))];const v=by(S.prov,provId(r));
  const t=ns.length?(ns.length>1?'Presupuestos: ':'Presupuesto: ')+ns.join(', '):v?'Proveedor: '+v.nombre:'';return t?`<div class="kprov">${esc(t)}</div>`:''};

const pagoFut=p=>!!p.fecha&&String(p.fecha).slice(0,10)>today(),prog=r=>pagos(r).filter(pagoFut).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

const epagoTxt=r=>{const e=epago(r),a=aprobado(r),p=paid(r),f=prog(r)[0];let t=e;
  if(e==='Parcial'||e==='Pendiente')t+=' · debe '+fmt(a-p);else if(e==='Pagado de más')t+=' '+fmt(p-a);
  if(f&&e!=='Pagado'&&e!=='Pagado de más')t+=' · pago programado '+fd(f.fecha).slice(0,5);return t};
const provId=r=>r.prov||(apr(r)||{}).prov;const provN=r=>{const v=by(S.prov,provId(r));return v?v.nombre:'—'};

let tt;function toast(m,ms=5000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms)}

const upd=async(k,id,d)=>{const row=S[k]&&S[k].find(x=>x.id===id),old=row?{...row}:null;if(row)Object.assign(row,d);const ok=await w(async()=>{await DB.doc(COL[k]+'/'+id).update(d);return true});if(!ok&&row&&old){Object.assign(row,old);render()}return ok};

function kpis(){
  const m=today().slice(0,7),act=S.prop.filter(p=>!tg(p).includes('VENDIDO')).length,vig=S.con.filter(vigente),ars=sum(vig.filter(c=>c.moneda!=='USD'),c=>c.monto),usd=sum(vig.filter(c=>c.moneda==='USD'),c=>c.monto);

  return`<div class="kpis">${k('props','Inmuebles',act,'sin contar los vendidos')}${k('alqs','Alquileres por mes','$ '+fnum(ars),vig.length+' contratos vigentes'+(usd?' · USD '+fnum(usd):''))}${k('imps','Impuestos del mes',ip,'sin pagar en '+MESES[+m.slice(5,7)-1].toLowerCase())}${k('reps','Reparaciones',ra,'abiertas')}</div>`+anillos();

// Anillos de progreso del Tablero
function anillo(v,tab,titulo,hecho,total,detalle,c1,c2){
  const p=total?Math.min(1,hecho/total):0,R=34,L=2*Math.PI*R,id='g'+tab+Math.round(p*1000);
  return`<div class="card ring" data-act="tab" data-v="${tab}"><svg viewBox="0 0 84 84" width="84" height="84" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--bd)" stroke-width="8"/>
    <circle cx="42" cy="42" r="${R}" fill="none" stroke="url(#${id})" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(L*p).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${total?Math.round(p*100)+'%':'—'}</text></svg>
    <div><span>${titulo}</span><b>${hecho} de ${total}</b><small>${detalle}</small></div></div>`;
}
function anillos(){
  const m=today().slice(0,7),mes=MESES[+m.slice(5,7)-1].toLowerCase(),y=m.slice(0,4),v=true;
  const vig=S.con.filter(vigente),cob=vig.filter(c=>S.cpa.some(z=>z.contrato===c.id&&String(z.periodo).startsWith(m)&&z.pagado===true)).length;
  const ia=new Set(S.imp.filter(i=>impAmia(i)).map(i=>i.id)),im=S.ipe.filter(z=>ia.has(z.impuesto)&&String(z.periodo).startsWith(m)),imp=im.filter(z=>z.pagado===true).length;

const RK=[2,1,0,3];
const OPS2=[['lista','Listado de reparaciones'],['estado','Por estado'],['inmueble','Por inmueble'],['proveedor','Por proveedor'],['tipo','Por tipo de arreglo']];let SEL2=new Set(),PREV2=null;
function repList(){

function reportRep(tipo){

  const lab={estado:'Estado',inmueble:'Inmueble',proveedor:'Proveedor',tipo:'Tipo de arreglo'}[tipo],key={estado:estOf,inmueble:pn,proveedor:pv,tipo:r=>r.categoria||'Sin categoría'}[tipo],g={};
  l.forEach(r=>{const k=key(r);const o=g[k]=g[k]||{[lab]:k,Reparaciones:0,Presupuestado:0,'Importe total':0,Pagado:0,'Saldo pendiente':0};o.Reparaciones++;o.Presupuestado+=pr(r);o['Importe total']+=aprobado(r);o.Pagado+=paid(r);o['Saldo pendiente']+=saldo(r)});
  const res=Object.values(g).sort((a,b)=>tipo==='estado'?RK[ESTADOS.indexOf(a[lab])]-RK[ESTADOS.indexOf(b[lab])]:String(a[lab]).localeCompare(String(b[lab])));

  return{label:OPS2.find(o=>o[0]===tipo)[1],res};
}

const fd=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';

    return dPick('Asignar a una necesidad',`Donación: ${dItemQ(d)}${donN(d)?' (de '+donN(d)+')':''}`,rows,'No hay necesidades pendientes.')}
  if(a==='asig'){const n=by(S.dnec,b.dataset.n),d=by(S.ddon,b.dataset.d);if(!n||!d)return;
    if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='¿Confirmar?';setTimeout(()=>{if(b.isConnected){b.dataset.ok='';b.textContent='Asignar'}},4000);return}
    if(await dRun(()=>sb.rpc('asignar',{p_necesidad:n.id,p_donacion:d.id}),`Asignada: ${dItemQ(d)} para ${necN(n)}. Cuando se entregue, marcala como entregada.`))dVolver();return}
  if(a==='entr'){const d=by(S.ddon,id),n=by(S.dnec,d.necesidad_id);
    return dOpen(`${dHead('Marcar como entregada',`${dItemQ(d)} → ${n?necN(n):d.destino_externo}`)}<form id="dentr" data-id="${d.id}">${L('Fecha de entrega',`<input name="f" type="date" value="${today()}" autofocus style="max-width:200px">`)}<div class="mut" style="margin-top:8px">La donación sale de las disponibles y la necesidad queda resuelta.</div><div class="bar2" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn s" data-dact="cerrar">Cancelar</button><button class="btn" type="submit">Confirmar entrega</button></div></form>`)}
  if(a==='ext'){const d=by(S.ddon,id),ds=[...new Set(S.ddon.map(x=>x.destino_externo).filter(Boolean))].sort(dcmp);
    return dOpen(`${dHead('Entregar a otro destino',dItemQ(d)+' — para destinos que no están en la lista de necesidades')}<form id="dext" data-id="${d.id}"><div class="r2">${L('Destino (institución o persona) *','<input name="dest" required autofocus list="ddest">')}${L('Fecha de entrega',`<input name="f" type="date" value="${today()}">`)}</div><datalist id="ddest">${ds.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="bar2" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn s" data-dact="cerrar">Cancelar</button><button class="btn" type="submit">Registrar entrega</button></div></form>`)}
  if(a==='desh'){if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='¿Seguro?';return}
    if(await dRun(()=>sb.rpc('deshacer_asignacion',{p_donacion:id}),'Asignación deshecha: la donación vuelve a estar disponible'))dVolver();else render();return}
  if(a==='cerrarN'||a==='reabrirN'){const c=a==='cerrarN';if(await dRun(()=>sb.from('necesidades').update({estado:c?'cerrada':'pendiente',fecha_entrega:c?today():null}).eq('id',id),c?'Necesidad cerrada':'Necesidad reabierta'))dVolver();return}
  if(a==='delnec'||a==='deldon'){if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='¿Eliminar? No se puede deshacer';return}
    const nec=a==='delnec',x=nec?by(S.dnec,id):by(S.ddon,id);
    if(x&&x.estado==='asignada'){const did=nec?x.donacion_id:x.id;if(did){const r=await sb.rpc('deshacer_asignacion',{p_donacion:did});if(r.error)return dErr(r.error)}}
    if(await dRun(()=>sb.from(nec?'necesidades':'donaciones').delete().eq('id',id),nec?'Necesidad eliminada':'Donación eliminada'))dVolver();return}
  if(a==='fele')return dOpen(`${dHead('Agregar elemento','Usar nombres generales (“Silla”, “Heladera”). La marca o las medidas van en el detalle de cada pedido.')}<form id="dele"><div class="r2">${L('Elemento *','<input name="nombre" required autofocus>')}${L('Rubro',`<input name="rubro" list="drub2" value="Otros"><datalist id="drub2">${[...new Set(S.del.map(e=>e.rubro))].sort(dcmp).map(r=>`<option value="${esc(r)}">`).join('')}</datalist>`)}</div><div class="bar2" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn s" data-dact="cerrar">Cancelar</button><button class="btn" type="submit">Agregar</button></div></form>`);
  if(a==='delele'){if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='¿Seguro?';return}await dRun(()=>sb.from('elementos').delete().eq('id',id),'Elemento eliminado');render();return}
  if(a==='feq')return dOpen(`${dHead('Agregar al equipo','Profesionales del Servicio Social, para “profesional a cargo”.')}<form id="deq"><div class="r2">${L('Apellido *','<input name="apellido" required autofocus>')}${L('Nombre','<input name="nombre">')}${L('Iniciales *','<input name="iniciales" required maxlength="8">')}${L('Sector','<input name="sector">')}${L('Interno','<input name="interno">')}${L('Mail (el de su usuario)','<input name="mail" type="email">')}</div><div class="bar2" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn s" data-dact="cerrar">Cancelar</button><button class="btn" type="submit">Agregar</button></div></form>`);
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.closest||!f.closest('#ddlg'))return;e.preventDefault();
  const v=Object.fromEntries([...new FormData(f).entries()].map(([k,x])=>[k,String(x).trim()]));
  if(f.id==='dform')return dSave(f);
  if(f.id==='dunew'){const btn=f.querySelector('[type=submit]');btn.disabled=true;const r=await uFn('crear',{email:v.email,rol:v.rol,clave:v.clave});btn.disabled=false;
    if(r.error)return toast(r.error==='NOFN'?'Falta publicar la función usuarios en Supabase.':r.error,8000);uCred('Usuario creado',v.email.toLowerCase(),v.clave);loadPer();loadUsr();return}
  if(f.id==='dclave'){if(v.a.length<8)return toast('Tiene que tener al menos 8 caracteres.');if(v.a!==v.b)return toast('Las dos contraseñas no coinciden.');
    const r=await sb.auth.updateUser({password:v.a,data:{debe_cambiar_clave:false}});if(r.error)return toast('No se pudo guardar: '+r.error.message,8000);
    delete $('#ddlg').dataset.forzado;dClose();toast('Contraseña guardada',3000);return}
  if(f.id==='dentr'){if(await dRun(()=>sb.rpc('entregar',{p_donacion:f.dataset.id,p_fecha:v.f||today()}),'Entrega registrada'))dVolver();return}
  if(f.id==='dext'){if(!v.dest)return toast('Indicá el destino.');if(await dRun(()=>sb.rpc('entregar_externo',{p_donacion:f.dataset.id,p_destino:v.dest,p_fecha:v.f||today()}),'Entrega registrada'))dVolver();return}
  if(f.id==='dele'){if(S.del.some(x=>dn(x.nombre).trim()===dn(v.nombre)))return toast('Ese elemento ya está en la lista.');if(await dRun(()=>sb.from('elementos').insert({nombre:dcap(v.nombre),rubro:v.rubro||'Otros'}),'Elemento agregado')){dClose();render()}return}
  if(f.id==='deq'){if(S.deq.some(x=>x.iniciales.toUpperCase()===v.iniciales.toUpperCase()))return toast('Esas iniciales ya están usadas.');if(await dRun(()=>sb.from('equipo').insert({...v,iniciales:v.iniciales.toUpperCase(),apellido:dcap(v.apellido),nombre:dcap(v.nombre),mail:v.mail.toLowerCase()}),'Agregado al equipo')){dClose();render()}return}
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.dt){const val=t.type==='checkbox'?t.checked:t.value.trim();if(t.dataset.f==='nombre'&&!val){render();return}
    await dRun(()=>sb.from(t.dataset.dt).update({[t.dataset.f]:t.dataset.f==='iniciales'?String(val).toUpperCase():val}).eq('id',t.dataset.id).select('id'),'Guardado');render();return}
  if(t.dataset&&t.dataset.drol){const uid=t.dataset.drol,p=S.dper.find(x=>x.user_id===uid);
    if(p&&p.email===UEMAIL&&t.value!=='admin'&&!confirm('Te estás sacando el rol de administrador. Vas a dejar de ver Donaciones y Usuarios. ¿Seguir?')){t.value=p.rol;return}
    const r=await sb.from('perfiles').update({rol:t.value}).eq('user_id',uid).select('user_id');
    if(r.error||!r.data||!r.data.length){dErr(r.error||{message:'No se pudo cambiar el rol.'});t.value=p?p.rol:t.value;return}
    toast('Rol actualizado: '+(ROLES.find(x=>x[0]===t.value)||[,''])[1],3000);await loadPer()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-dq')){DQ=t.value;const l=$('#dlist');if(l)l.innerHTML=dList();return}
  if(t.id==='dpq'){const q=dn(t.value).trim();document.querySelectorAll('#dpl .drow').forEach(r=>r.style.display=!q||q.split(/\s+/).every(w=>r.dataset.txt.includes(w))?'':'none')}
});

function mkDB(){return{
  collection:n=>({
    async add(d){const r=await sb.from(n).insert(clean(d)).select('id').single();ck(r.error);pushU({op:'del',n,id:r.data.id});await(LOAD[n]&&LOAD[n]());return r.data},
    async upsert(d,cf){const ks=cf.split(','),old=[...(CACHE[n]||new Map()).values()].find(x=>ks.every(k=>sameK(x[k],d[k])));const r=await sb.from(n).upsert(clean(d),{onConflict:cf}).select('id');ck(r.error);const row=r.data&&r.data[0];if(row){if(old){const prev={};Object.keys(d).forEach(k=>prev[k]=old[k]===undefined?null:old[k]);pushU({op:'upd',n,id:old.id,prev})}else pushU({op:'del',n,id:row.id})}await(LOAD[n]&&LOAD[n]());return row},
    onSnapshot(cb,err){let t;const load=async()=>{let all=[],from=0;for(;;){const r=await sb.from(n).select('*').order('created_at').order('id').range(from,from+999);if(r.error)return err&&err(r.error);all=all.concat(r.data);if(!r.data.length||from>=200000)break;from+=r.data.length}CACHE[n]=new Map(all.map(x=>[x.id,x]));cb({docs:all.map(x=>({id:x.id,data:()=>{const{id,created_at,...y}=x;return y}}))})};LOAD[n]=load;load();
      sb.channel('rt-'+n).on('postgres_changes',{event:'*',schema:'public',table:n},()=>{clearTimeout(t);t=setTimeout(load,150)}).subscribe()}}),
  doc:p=>{const[n,id]=p.split('/');return{
    async update(d){const old=(CACHE[n]||new Map()).get(id);const x=await sb.from(n).update(clean(d)).eq('id',id).select('id');ck(x.error);if(!x.data||!x.data.length)throw new Error('No se pudo guardar: tu usuario no tiene permiso de edición');if(old){const prev={};Object.keys(d).forEach(k=>prev[k]=old[k]===undefined?null:old[k]);pushU({op:'upd',n,id,prev})}await(LOAD[n]&&LOAD[n]())},
    async delete(){const old=(CACHE[n]||new Map()).get(id);const x=await sb.from(n).delete().eq('id',id).select('id');ck(x.error);if(!x.data||!x.data.length)throw new Error('No se pudo eliminar: tu usuario no tiene permiso de edición');if(old)pushU({op:'ins',n,row:old});await(LOAD[n]&&LOAD[n]())}}}}}
function mkAssets(){return{async upload(f){const path=crypto.randomUUID()+'/'+f.name.replace(/[^\w.\-]+/g,'_');ck((await sb.storage.from('adjuntos').upload(path,f)).error);return{id:path,url:'sb:'+path}}}}
function login(){
  $('#nav').innerHTML='';$('#app').innerHTML='<div class="card" style="max-width:340px;margin:30px auto"><h2 style="margin-top:0">Ingresar</h2><label>Correo</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password"><div style="margin-top:12px"><button class="btn" id="go">Entrar</button></div></div>';
  const go=async()=>{const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});r.error?toast('No se pudo ingresar: '+r.error.message):start()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
async function start(){
  $('#app').innerHTML='<div class="card empty">Cargando…</div>';
  // Quién entra y con qué rol: el solicitante solo ve "Pedidos"
  let uid='';
  let provisoria=false;
  try{const r=await sb.auth.getUser();const u=r&&r.data&&r.data.user;uid=u?u.id:'';UID=uid;UEMAIL=String((u&&u.email)||'').trim().toLowerCase();provisoria=!!(u&&u.user_metadata&&u.user_metadata.debe_cambiar_clave)}catch(e){}
  try{const r=await sb.from('perfiles').select('rol').eq('user_id',uid).maybeSingle();ROL=(r&&r.data&&r.data.rol)||'lector'}catch(e){ROL='lector'}
  DB=mkDB();ASSETS=mkAssets();$('#out').style.display='';
  if(ROL!=='solicitante')for(const k of Object.keys(COL))DB.collection(COL[k]).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(k==='prov')S.prov.sort((a,b)=>String(a.nombre||'').trim().localeCompare(String(b.nombre||'').trim(),'es',{sensitivity:'base',numeric:true}));render()},e=>toast(e.message));
  if(ROL==='admin'||ROL==='solicitante'){
    for(const k of Object.keys(DCOL))DB.collection(DCOL[k]).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));DERR='';render()},e=>{DERR=(e&&e.message)||'error';render()});
    if(ROL==='admin'){loadPer();loadUsr();sb.channel('rt-perfiles').on('postgres_changes',{event:'*',schema:'public',table:'perfiles'},()=>loadPer()).subscribe()}
  }
  render();
  if(provisoria)pedirClave()}
$('#out').onclick=async()=>{try{sessionStorage.removeItem('inm-view');sessionStorage.removeItem('inm-prop')}catch(e){}await sb.auth.signOut();location.reload()};
(async()=>{const r=await sb.auth.getSession();r.data.session?start():login()})();
