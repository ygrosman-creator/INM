<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INMUEBLES - REPARACIONES</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#e3e1da;--ac:#1d6b5a;--acbg:#e2f1ed;--warn:#b45309;--warnbg:#fdf0dc;--ok:#15803d;--okbg:#e1f4e7;--bad:#b91c1c;--badbg:#fbe4e4;--rbg:#fde4e4;--rtx:#b91c1c;--nbg:#ffe8d1;--ntx:#c2410c;--ybg:#fdf3b8;--ytx:#92660a;--vbg:#ede4fb;--vtx:#6d28d9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#212426;--tx:#e8e8e5;--mut:#9aa0a6;--bd:#34383b;--ac:#5fc4ac;--acbg:#1e3a34;--warn:#f0b35a;--warnbg:#3a2d17;--ok:#6fd08c;--okbg:#1c3626;--bad:#f28b82;--badbg:#3d1f1f;--rbg:#4a2323;--rtx:#f28b82;--nbg:#472a14;--ntx:#fdba74;--ybg:#473f12;--ytx:#fde047;--vbg:#33264f;--vtx:#c4b5fd}}
:root[data-theme="dark"]{--bg:#17191a;--card:#212426;--tx:#e8e8e5;--mut:#9aa0a6;--bd:#34383b;--ac:#5fc4ac;--acbg:#1e3a34;--warn:#f0b35a;--warnbg:#3a2d17;--ok:#6fd08c;--okbg:#1c3626;--bad:#f28b82;--badbg:#3d1f1f;--rbg:#4a2323;--rtx:#f28b82;--nbg:#472a14;--ntx:#fdba74;--ybg:#473f12;--ytx:#fde047;--vbg:#33264f;--vtx:#c4b5fd}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:20px 0 8px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
header input{width:180px}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--mut);font:inherit;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mut);font-size:13px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10201c}
.btn.s{background:var(--acbg);color:var(--ac)}.btn.d{background:none;color:var(--bad);border:1px solid var(--bd)}
.btn.x{padding:2px 8px;background:none;color:var(--mut);border:1px solid var(--bd)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bd)}
td{padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:var(--acbg)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--acbg);color:var(--ac);white-space:nowrap}
.badge.w{background:var(--warnbg);color:var(--warn)}.badge.o{background:var(--okbg);color:var(--ok)}.badge.u{background:var(--badbg);color:var(--bad)}
.mut{color:var(--mut);font-size:13px}.neg{color:var(--warn);font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:6px 8px;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar2>*{width:auto;flex:1;min-width:140px}.bar2>.btn{flex:0 0 auto}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:18px;width:min(860px,95vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.r2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 10px}
.sub{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.docs{display:flex;flex-wrap:wrap;gap:8px}.doc{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:13px;max-width:200px}
.doc img{display:block;width:100%;max-height:90px;object-fit:cover;border-radius:5px;margin-bottom:4px}
a{color:var(--ac);word-break:break-all}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--acbg);border-radius:10px;padding:8px;min-height:160px}.col h3{font-size:13px;margin:2px 4px 8px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px;cursor:grab}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:99;max-width:90vw}
.empty{text-align:center;color:var(--mut);padding:24px}
.badge.r{background:var(--rbg);color:var(--rtx)}.badge.n{background:var(--nbg);color:var(--ntx)}.badge.y{background:var(--ybg);color:var(--ytx)}.badge.v{background:var(--vbg);color:var(--vtx)}
.col.c0{background:var(--rbg)}.col.c1{background:var(--nbg)}.col.c2{background:var(--ybg)}.col.c3{background:var(--okbg)}
.col.c0 h3{color:var(--rtx)}.col.c1 h3{color:var(--ntx)}.col.c2 h3{color:var(--ytx)}.col.c3 h3{color:var(--ok)}
.chk{display:inline-flex;gap:6px;align-items:center;margin:0 14px 6px 0;font-size:14px;color:var(--tx)}.chk input{width:auto}
</style></head><body>
<div id="root"><header><h1>Inmuebles | Reparaciones y Mantenimiento</h1><input id="me" placeholder="Tu nombre" title="Se usa en pagos y novedades"><button class="btn s" id="out" style="display:none">Salir</button></header><nav id="nav"></nav><div id="app"></div></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const today=()=>new Date().toISOString().slice(0,10);
const COL={prop:'propiedades',rep:'reparaciones',pre:'presupuestos',pag:'pagos',prov:'proveedores'};
const S={prop:[],rep:[],pre:[],pag:[],prov:[]};
const ESTADOS=['PENDIENTE DE REVISIÓN','SOLICITADO PRESUPUESTO','EN EJECUCIÓN','FINALIZADO'];
const PRIO=['Baja','Normal','Alta','Urgente'],CATS=['Plomería','Electricidad','Albañilería','Pintura','Techos','Ascensores','Seguridad','Otros'];
const PEST=['Recibido','En evaluación','Aprobado','Rechazado','Vencido'],MEDIOS=['Transferencia','Cheque','Efectivo','Otro'],EPROP=['ALQUILADO','EN ALQUILER','A LA VENTA','EN COMODATO','DE AMIA','VARIOS'];
const DOCC=['Foto del problema','Foto del trabajo terminado','Factura','Comprobante','Otro'],MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let BUSY=false,ARM=null,DB=null,ASSETS=null,view='kan',selProp=null,dlg=null,dragId=null,F={q:'',p:'',v:'',pr:'',e:'',y:'',rp:''};
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0),by=(a,id)=>a.find(x=>x.id===id);
const nx=(a,f,p,n)=>p+String(Math.max(0,...a.map(x=>parseInt(String(x[f]||'').replace(/\D/g,''))||0))+1).padStart(n,'0');
const me=()=>{try{return localStorage.getItem('me')||''}catch(e){return''}};
const pres=r=>S.pre.filter(p=>p.rep===r.id),pagos=r=>S.pag.filter(p=>p.rep===r.id);
const apr=r=>pres(r).find(p=>p.estado==='Aprobado');
const aprobado=r=>apr(r)?+apr(r).monto||0:0,paid=r=>sum(pagos(r),p=>p.monto),saldo=r=>aprobado(r)-paid(r);
const epago=r=>{const a=aprobado(r),p=paid(r);if(!a&&!p&&estOf(r)===ESTADOS[3])return'Dado de baja';return p>a?'Con diferencia':!a&&!p?'Sin aprobar':p>=a?'Pagado':p?'Parcial':'Pendiente'};
const provId=r=>r.prov||(apr(r)||{}).prov;const provN=r=>{const v=by(S.prov,provId(r));return v?v.nombre:'—'};
const open=r=>!['Finalizada','Cancelada'].includes(r.estado);
const opts=(l,sel,blank)=>(blank!=null?`<option value="">${blank}</option>`:'')+l.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`}).join('');
let tt;function toast(m,ms=5000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms)}
async function w(fn){try{return await fn()}catch(e){toast(/row-level security/i.test((e&&e.message)||'')?'Tu usuario no tiene permiso de edición.':(e&&e.message)||'Error al guardar',9000)}}
const upd=(k,id,d)=>w(async()=>{await DB.doc(COL[k]+'/'+id).update(d);return true});
const bd=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const ECLS=['r','n','y','o'];
const estOf=r=>{const e=String(r.estado||'').toUpperCase();if(/FINALIZ|CANCEL/.test(e))return ESTADOS[3];if(/EJECUC|APROBAD/.test(e))return ESTADOS[2];if(/PRESUPUESTO|APROBACI/.test(e))return ESTADOS[1];return ESTADOS[0]};
const eb=r=>{const e=estOf(r);return bd(e,ECLS[ESTADOS.indexOf(e)])};
const pb=p=>bd(p,p==='Urgente'||p==='Alta'?'u':''),xb=r=>{const e=epago(r);return bd(e,e==='Pagado'?'o':e==='Con diferencia'?'v':e==='Sin aprobar'||e==='Dado de baja'?'':'w')};
const att=a=>a?`<a href="#" data-sign="${esc(a.url)}">${esc(a.name)}</a>`:'<span class="mut">Sin archivo</span>';

function repTable(l){
  if(!l.length)return'<div class="empty">No hay reparaciones para mostrar.</div>';
  return`<div class="wrap"><table style="min-width:760px"><tr><th>Reparación</th><th>Dirección del inmueble</th><th>Proveedor</th><th>Estado</th><th>Importe total</th><th>Pagado</th><th>Saldo pendiente</th></tr>`+l.map(r=>{const p=by(S.prop,r.prop);return`<tr class="row" data-act="rep" data-id="${r.id}"><td><b>${esc(r.titulo||'Sin título')}</b></td><td>${esc(p?p.direccion:'—')}</td><td>${esc(provN(r))}</td><td>${eb(r)}</td><td>${aprobado(r)?fmt(aprobado(r)):'<span class="mut">Sin presupuesto aprobado</span>'}</td><td>${fmt(paid(r))}</td><td class="${saldo(r)>0?'neg':''}">${aprobado(r)||paid(r)?fmt(saldo(r)):'—'}</td></tr>`}).join('')+'</table></div>';
}
function pagoTable(l,conPagado){
  return`<div class="wrap"><table style="min-width:560px"><tr><th>Dirección del inmueble</th><th>Proveedor</th><th>Importe total</th>${conPagado?'<th>Pagado</th>':''}<th>Saldo pendiente</th></tr>`+l.map(r=>{const p=by(S.prop,r.prop);return`<tr class="row" data-act="rep" data-id="${r.id}"><td><b>${esc(p?p.direccion:'—')}</b></td><td>${esc(provN(r))}</td><td>${fmt(aprobado(r))}</td>${conPagado?`<td>${fmt(paid(r))}</td>`:''}<td class="${saldo(r)>0?'neg':''}">${fmt(saldo(r))} ${epago(r)==='Con diferencia'?bd('Con diferencia','v'):''}</td></tr>`}).join('')+'</table></div>';
}
function vKan(){
  return`<div class="bar2"><button class="btn" data-act="new" data-k="rep">+ Nueva reparación</button></div><div class="kan">`+ESTADOS.map((e,i)=>{const l=S.rep.filter(r=>estOf(r)===e);return`<div class="col c${i}" data-drop="${e}"><h3>${e} <span class="mut">${l.length}</span></h3>`+l.map(r=>{const p=by(S.prop,r.prop);return`<div class="kc" draggable="true" data-act="rep" data-id="${r.id}"><b>${esc(r.titulo||'Sin título')}</b><div class="mut">${esc(p?p.direccion:'')}</div><div style="margin-top:4px">${pb(r.prioridad||'Normal')} ${xb(r)}</div></div>`}).join('')+'</div>'}).join('')+'</div><div class="mut">Arrastrá las tarjetas para cambiar el estado (en el celular, abrí la reparación).</div>';
}
const RK=[2,1,0,3];
const OPS2=[['lista','Listado de reparaciones'],['estado','Por estado'],['inmueble','Por inmueble'],['proveedor','Por proveedor'],['tipo','Por tipo de arreglo']];let SEL2=new Set(),PREV2=null;
function repList(){
  const q=F.q.toLowerCase();
  return S.rep.filter(r=>(!F.p||r.prop===F.p)&&(!F.v||provId(r)===F.v)&&(!F.pr||r.prioridad===F.pr)&&(!F.e||estOf(r)===F.e)&&(!q||[r.titulo,r.responsable,r.solicitante,(by(S.prop,r.prop)||{}).direccion].join(' ').toLowerCase().includes(q)))
   .sort((a,b)=>RK[ESTADOS.indexOf(estOf(a))]-RK[ESTADOS.indexOf(estOf(b))]||(b.fechaSol||'').localeCompare(a.fechaSol||''));
}
function reportRep(tipo){
  const l=repList(),pn=r=>{const x=by(S.prop,r.prop);return x?x.direccion:'Sin inmueble'},pv=r=>{const v=provN(r);return v==='—'?'Sin proveedor':v},pr=r=>sum(pres(r),x=>x.monto);
  if(tipo==='lista')return{label:'Listado de reparaciones',res:l.map(r=>({Reparación:r.titulo||'',Inmueble:pn(r),Categoría:r.categoria||'',Proveedor:pv(r),Estado:estOf(r),Prioridad:r.prioridad||'',Fecha:r.fechaSol||'','Importe total':aprobado(r),Pagado:paid(r),'Saldo pendiente':saldo(r),'Estado de pago':epago(r)}))};
  const lab={estado:'Estado',inmueble:'Inmueble',proveedor:'Proveedor',tipo:'Tipo de arreglo'}[tipo],key={estado:estOf,inmueble:pn,proveedor:pv,tipo:r=>r.categoria||'Sin categoría'}[tipo],g={};
  l.forEach(r=>{const k=key(r);const o=g[k]=g[k]||{[lab]:k,Reparaciones:0,Presupuestado:0,'Importe total':0,Pagado:0,'Saldo pendiente':0};o.Reparaciones++;o.Presupuestado+=pr(r);o['Importe total']+=aprobado(r);o.Pagado+=paid(r);o['Saldo pendiente']+=saldo(r)});
  const res=Object.values(g).sort((a,b)=>tipo==='estado'?RK[ESTADOS.indexOf(a[lab])]-RK[ESTADOS.indexOf(b[lab])]:String(a[lab]).localeCompare(String(b[lab])));
  if(res.length){const k0=Object.keys(res[0])[0],tot={[k0]:'TOTAL'};Object.keys(res[0]).slice(1).forEach(c=>tot[c]=sum(res,x=>x[c]));res.push(tot)}
  return{label:OPS2.find(o=>o[0]===tipo)[1],res};
}
function dl2(){
  if(!window.XLSX)return toast('No se pudo cargar el generador de Excel. Revisá la conexión o el bloqueador.');
  if(!PREV2||!PREV2.length)return;
  const wb=XLSX.utils.book_new();
  PREV2.forEach(p=>{const d=p.res,w=XLSX.utils.json_to_sheet(d.length?d:[{'Sin datos':''}]);w['!cols']=Object.keys(d[0]||{a:1}).map(c=>({wch:Math.max(14,c.length+2)}));XLSX.utils.book_append_sheet(wb,w,p.label.slice(0,31))});
  XLSX.writeFile(wb,'informe-reparaciones.xlsx');
}
function vReps(){
  const l=repList();
  return`<div class="bar2"><input data-flt="q" placeholder="Buscar…" value="${esc(F.q)}"><select data-flt="p">${opts(S.prop.map(p=>[p.id,p.direccion]),F.p,'Todos los inmuebles')}</select><select data-flt="v">${opts(S.prov.map(p=>[p.id,p.nombre]),F.v,'Todos los proveedores')}</select><select data-flt="pr">${opts(PRIO,F.pr,'Toda prioridad')}</select><select data-flt="e">${opts(ESTADOS,F.e,'Todo estado')}</select><button class="btn" data-act="new" data-k="rep">+ Nueva</button></div><div class="card">${repTable(l)}</div>
  <h2>Informe en Excel</h2><div class="card"><div class="mut" style="margin-bottom:8px">Elegí una o varias opciones (usa los filtros de arriba), mirá la vista previa y después descargá un solo archivo.</div>${OPS2.map(([k,t])=>`<label class="chk"><input type="checkbox" data-chk2="${k}" ${SEL2.has(k)?'checked':''}> ${t}</label>`).join('')}<div class="bar2" style="margin-top:6px"><button class="btn" data-act="prev2">Vista previa</button>${PREV2&&PREV2.length?'<button class="btn s" data-act="dl2">Descargar Excel</button>':''}</div>
  ${PREV2?PREV2.map(p=>`<h2>${p.label}</h2>${p.res.length?tbl(p.res):'<div class="empty">No hay reparaciones para mostrar.</div>'}`).join(''):''}</div>`;
}
function vPagos(){
  const pend=S.rep.filter(r=>saldo(r)!==0&&(aprobado(r)>0||paid(r)>0)).sort((a,b)=>saldo(b)-saldo(a)),con=S.rep.filter(r=>pagos(r).length).sort((a,b)=>saldo(b)-saldo(a));
  return`<div class="grid"><div class="card kpi"><b>${fmt(sum(S.rep,aprobado))}</b><span>aprobado total</span></div><div class="card kpi"><b>${fmt(sum(S.rep,paid))}</b><span>pagado</span></div><div class="card kpi"><b class="neg">${fmt(sum(S.rep,r=>Math.max(0,saldo(r))))}</b><span>saldo pendiente</span></div></div>
  <h2>Trabajos aprobados con saldo</h2><div class="card">${pend.length?pagoTable(pend,true):'<div class="empty">No hay trabajos con saldo pendiente. Un trabajo aparece acá cuando tiene un presupuesto en estado Aprobado (con su importe) y todavía falta pagar.</div>'}</div>
  <h2>Pagos registrados</h2><div class="card">${con.length?pagoTable(con,false):'<div class="empty">Todavía no hay pagos registrados.</div>'}</div>`;
}
function vProps(){
  return`<div class="bar2"><button class="btn" data-act="new" data-k="prop">+ Nueva propiedad</button></div>`+(S.prop.length?`<div class="grid">${S.prop.map(p=>{const l=S.rep.filter(r=>r.prop===p.id);return`<div class="card" style="cursor:pointer" data-act="prop" data-id="${p.id}"><b>${esc(p.direccion)}</b> ${p.estado?bd(p.estado):''}<div class="mut">${esc([p.localidad,p.responsable].filter(Boolean).join(' · '))}</div><div style="margin-top:8px">${l.length} reparaciones</div><div>Importe total ${fmt(sum(l,aprobado))}</div><div>Pagado ${fmt(sum(l,paid))} · <span class="${sum(l,r=>Math.max(0,saldo(r)))?'neg':''}">Saldo ${fmt(sum(l,r=>Math.max(0,saldo(r))))}</span></div>${l.some(r=>!aprobado(r)&&pres(r).length&&estOf(r)!==ESTADOS[3])?'<div class="mut">Hay presupuestos sin aprobar</div>':''}</div>`}).join('')}</div>`:'<div class="card empty">Cargá primero las propiedades.</div>');
}
function vProp(){
  const p=by(S.prop,selProp);if(!p){view='props';return vProps()}const l=S.rep.filter(r=>r.prop===p.id).sort((a,b)=>(b.fechaSol||'').localeCompare(a.fechaSol||''));
  return`<div class="bar2"><button class="btn s" data-act="tab" data-v="props">← Propiedades</button><button class="btn s" data-act="edit" data-k="prop" data-id="${p.id}">Editar datos</button><button class="btn" data-act="new" data-k="rep" data-p="${p.id}">+ Nueva reparación</button></div>
  <div class="card"><h1>${esc(p.direccion)}</h1><div class="mut">${esc([p.localidad,p.estado,p.responsable&&'Responsable: '+p.responsable].filter(Boolean).join(' · '))}</div><p>${esc(p.obs||'')}</p><div class="grid"><div class="kpi"><b>${fmt(sum(l,aprobado))}</b><span>importe total</span></div><div class="kpi"><b>${fmt(sum(l,paid))}</b><span>pagado</span></div><div class="kpi"><b>${fmt(sum(l,r=>Math.max(0,saldo(r))))}</b><span>saldo pendiente</span></div></div></div><h2>Historial de reparaciones</h2><div class="card">${repTable(l)}</div>`;
}
function vProvs(){
  const cobrado=v=>sum(S.pag.filter(x=>(x.prov||provId(by(S.rep,x.rep)||{}))===v.id),x=>x.monto);

    reps.forEach(r=>{const k=key(r);const o=g[k]=g[k]||{[lab]:k,Reparaciones:0,Presupuestado:0,Aprobado:0,Pagado:0,Saldo:0};o.Reparaciones++;o.Presupuestado+=pr(r);o.Aprobado+=aprobado(r);o.Pagado+=paid(r);o.Saldo+=saldo(r)});
    res=Object.values(g).sort((a,b)=>String(a[lab]).localeCompare(String(b[lab])));

  if(c==='pag'&&f==='monto'){const o=by(S.pag,id),a=aprobado(r);if(a>0&&paid(r)-(+o.monto||0)+v>a)toast('El total pagado supera el importe aprobado: requiere aprobación adicional.')}
  upd(c,id,{[f]:v});
});
document.addEventListener('input',ev=>{if(ev.target.dataset.flt==='q'){F.q=ev.target.value;clearTimeout(window._f);window._f=setTimeout(()=>{render();const n=document.querySelector('[data-flt="q"]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)}});

let mdOut=false;const outside=e=>{const r=$('#dlg').getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};
$('#dlg').addEventListener('mousedown',e=>{mdOut=outside(e)});

document.addEventListener('paste',e=>{const t=e.target;if(t.type!=='date')return;const x=(e.clipboardData.getData('text')||'').trim(),m=x.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);const iso=m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:/^\d{4}-\d{2}-\d{2}$/.test(x)?x:null;if(iso){e.preventDefault();t.value=iso;t.dispatchEvent(new Event('change',{bubbles:true}))}});
$('#dlg').addEventListener('close',()=>{dlg=null;ARM=null});

const sb=supabase.createClient(CFG.url,CFG.key);
const clean=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v===''?null:v]));
const ck=e=>{if(e)throw e};
const LOAD={};
function mkDB(){return{
  collection:n=>({
    async add(d){const r=await sb.from(n).insert(clean(d)).select('id').single();ck(r.error);await(LOAD[n]&&LOAD[n]());return r.data},
    onSnapshot(cb,err){let t;const load=async()=>{const r=await sb.from(n).select('*').order('created_at');if(r.error)return err&&err(r.error);cb({docs:r.data.map(x=>({id:x.id,data:()=>{const{id,created_at,...y}=x;return y}}))})};LOAD[n]=load;load();
      sb.channel('rt-'+n).on('postgres_changes',{event:'*',schema:'public',table:n},()=>{clearTimeout(t);t=setTimeout(load,150)}).subscribe()}}),
  doc:p=>{const[n,id]=p.split('/');return{async update(d){const x=await sb.from(n).update(clean(d)).eq('id',id).select('id');ck(x.error);if(!x.data||!x.data.length)throw new Error('No se pudo guardar: tu usuario no tiene permiso de edición');await(LOAD[n]&&LOAD[n]())},async delete(){const x=await sb.from(n).delete().eq('id',id).select('id');ck(x.error);if(!x.data||!x.data.length)throw new Error('No se pudo eliminar: tu usuario no tiene permiso de edición');await(LOAD[n]&&LOAD[n]())}}}}}
function mkAssets(){return{async upload(f){const path=crypto.randomUUID()+'/'+f.name.replace(/[^\w.\-]+/g,'_');ck((await sb.storage.from('adjuntos').upload(path,f)).error);return{id:path,url:'sb:'+path}}}}
function login(){
  $('#nav').innerHTML='';$('#app').innerHTML='<div class="card" style="max-width:340px;margin:30px auto"><h2 style="margin-top:0">Ingresar</h2><label>Correo</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password"><div style="margin-top:12px"><button class="btn" id="go">Entrar</button></div></div>';
  const go=async()=>{const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});r.error?toast('No se pudo ingresar: '+r.error.message):start()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
function start(){
  DB=mkDB();ASSETS=mkAssets();$('#out').style.display='';
  for(const k of Object.keys(COL))DB.collection(COL[k]).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast(e.message));
  render()}
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
(async()=>{const r=await sb.auth.getSession();r.data.session?start():login()})();
</script></body></html>
