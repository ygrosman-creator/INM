/* Menú: las rayitas junto al título lo abren al pasar el mouse (o con un clic en el celular) */

.brand{display:flex;align-items:center;gap:8px}

function anillo(v,tab,titulo,hecho,total,detalle,c1,c2){

function impRank(x){const t=today();if(x&&x.pagado)return[3,''];const v=x&&x.vencimiento;if(!v)return[2,''];return v>=t?[0,v]:[1,v]}
function impRows(m,PM){
  return S.imp.filter(i=>{const x=PM.get(i.id+'|'+m),pg=!!(x&&x.pagado);return impBase(i)&&(!F.ip||(F.ip==='si'?pg:!pg))}).sort((a,b)=>{

function reportImp(tipo){

}

  for(let n=0;n<20;n++){

  return out}

    cp=ms.reduce((t,m)=>t*(1+IDX.ipc.get(m)/100),1);det.push('IPC '+ms.map(m=>MESES[+m.slice(5)-1].slice(0,3).toLowerCase()+' '+fnum(IDX.ipc.get(m))+'%').join(', '))}

function mkDB(){return{
  collection:n=>({
    async add(d){const r=await sb.from(n).insert(clean(d)).select('id').single();ck(r.error);pushU({op:'del',n,id:r.data.id});await(LOAD[n]&&LOAD[n]());return r.data},
    async upsert(d,cf){const ks=cf.split(','),old=[...(CACHE[n]||new Map()).values()].find(x=>ks.every(k=>sameK(x[k],d[k])));const r=await sb.from(n).upsert(clean(d),{onConflict:cf}).select('id');ck(r.error);const row=r.data&&r.data[0];if(row){if(old){const prev={};Object.keys(d).forEach(k=>prev[k]=old[k]===undefined?null:old[k]);pushU({op:'upd',n,id:old.id,prev})}else pushU({op:'del',n,id:row.id})}await(LOAD[n]&&LOAD[n]());return row},
    onSnapshot(cb,err){let t;const load=async()=>{let all=[],from=0;for(;;){const r=await sb.from(n).select('*').order('created_at').order('id').range(from,from+999);if(r.error)return err&&err(r.error);all=all.concat(r.data);if(!r.data.length||from>=200000)break;from+=r.data.length}CACHE[n]=new Map(all.map(x=>[x.id,x]));cb({docs:all.map(x=>({id:x.id,data:()=>{const{id,created_at,...y}=x;return y}}))})};LOAD[n]=load;load();
      sb.channel('rt-'+n).on('postgres_changes',{event:'*',schema:'public',table:n},()=>{clearTimeout(t);t=setTimeout(load,150)}).subscribe()}}),
  doc:p=>{const[n,id]=p.split('/');return{
    async update(d){const old=(CACHE[n]||new Map()).get(id);const x=await sb.from(n).update(clean(d)).eq('id',id).select('id');ck(x.error);if(!x.data||!x.data.length)throw new Error('No se pudo guardar: tu usuario no tiene permiso de edición');if(old){const prev={};Object.keys(d).forEach(k=>prev[k]=old[k]===undefined?null:old[k]);pushU({op:'upd',n,id,prev})}await(LOAD[n]&&LOAD[n]())},
    async delete(){const old=(CACHE[n]||new Map()).get(id);const x=await sb.from(n).delete().eq('id',id).select('id');ck(x.error);if(!x.data||!x.data.length)throw new Error('No se pudo eliminar: tu usuario no tiene permiso de edición');if(old)pushU({op:'ins',n,row:old});await(LOAD[n]&&LOAD[n]())}}}}}
